[project]
name = "rev-recovery"
version = "0.1.0"
description = "AI-powered revenue recovery backend using Razorpay + LiveKit"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "setuptools>=75.0",
    "motor==3.6.0",
    "pymongo>=4.9,<4.10",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "livekit-agents>=0.12.3",
    "livekit-plugins-google>=0.10.0",
    "livekit-plugins-deepgram>=0.7.0",
    "livekit-plugins-elevenlabs>=0.8.0",
    "livekit-plugins-silero>=0.7.4",
    "livekit>=0.18.1",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "anyio>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
